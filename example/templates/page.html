<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} — {{ .SiteTitle }}</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html">{{ .SiteTitle }}</a>
  </header>
  <main class="page">
    <h1>{{ .Title }}</h1>
    {{- if not .Date.IsZero }}
    <time class="page-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
    {{- end }}
    {{ .Content -}}
  </main>
</body>
</html>
